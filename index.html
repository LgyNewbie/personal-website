<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
    
        .container {
            text-align: center;
        }
    
        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }
    
        p {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }
    
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
    
        button:hover {
            background: #2563eb;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello World!</h1>
        <p>Welcome to my first website.</p>
        <button onclick="sayHello()">Click Me</button>
    </div>
    
    <script>
        function sayHello() {
            alert("Hello! Welcome to my website!");
        }
    </script>

</body>
</html>
